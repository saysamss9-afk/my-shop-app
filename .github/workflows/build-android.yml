name: Build Android Production APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Android Admin Release
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleAdminRelease --no-daemon

      - name: Build Android User Release
        run: |
          cd android
          ./gradlew assembleUserRelease --no-daemon

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: admin-apk
          path: android/app/build/outputs/apk/admin/release/app-admin-release.apk

      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: user-apk
          path: android/app/build/outputs/apk/user/release/app-user-release.apk
